<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashbord</title>
</head>
<link rel="stylesheet" href="weather.css">
<body>

<h1> Weather Dashbord</h1>
<input type="text" placeholder="Enter City Name">
<button>Search Weather</button>
<p id="message"></p>

<div id="loader" class="spinner"></div>
   



<div id="weather-info"></div>
</div>
<h2>Your City</h2>
<div class="wd-details">
    <div class="detailcd">
        <p>💧 Humidity</p>
        <h3 id="humidity">--%</h3>
    </div>
    <div class="detailcd">
        <p>〰️ Wind speed</p>
        <h3 id="wind-speed">--m/s</h3>
    </div>
    <div class="detailcd">
         <p>🌡️ Feels like</p>
         <h3 id="feels-like">--°C</h3>
</div>
</div>
<div class="favorites-section">
    <h2>⭐ My Favorites</h2>
    <div id="favoritesList"></div>
</div>



    <script src="weather .js" ></script>
</body>
</html>
